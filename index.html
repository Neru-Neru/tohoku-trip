<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f9fc"><title>東北、3日間。｜旅程タイムライン</title>
<style>
/* デジタル庁デザインシステムの明瞭な情報階層・アクセシビリティ指針を参考にした独自UI */

:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif;color:#172b4d;background:#f7f9fc}*{box-sizing:border-box}body{margin:0}main{max-width:620px;margin:auto;padding:28px 18px 70px}header{display:flex;justify-content:space-between;gap:12px;align-items:start}.eyebrow{font-size:11px;letter-spacing:.13em;color:#375e91;font-weight:700}h1{font-size:28px;letter-spacing:-.05em;margin:8px 0}h2{font-size:21px;margin:22px 0 4px}p{line-height:1.7}.sub{color:#4e6078;font-size:13px;margin:0}.clock{font-variant-numeric:tabular-nums;font-size:20px;font-weight:750;text-align:right}.days{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:25px}.day{border:1px solid #ccd7e5;background:white;border-radius:13px;padding:10px 5px;min-height:68px;color:inherit;cursor:pointer}.day[aria-pressed=true]{border-color:#1456ba;background:#1456ba;color:white}.day[aria-pressed=true] small{color:white}.day b{display:block;font-size:22px}.day small{font-size:11px;color:#4e6078}.section-head{display:flex;justify-content:space-between;align-items:center;margin:20px 0 15px}.today{border:1px solid #b9c9de;color:#1456ba;border-radius:10px;padding:10px 12px;background:white;font-weight:600}.timeline{position:relative}.item{display:grid;grid-template-columns:48px 16px 1fr;gap:8px;min-height:78px}.time{padding-top:17px;font-size:12px;font-weight:750;font-variant-numeric:tabular-nums}.track{display:flex;align-items:center;flex-direction:column}.dot{width:11px;height:11px;border:2px solid #9aabc1;border-radius:50%;background:white;margin-top:19px;z-index:1;flex:none}.stem{background:#d8e0eb;width:2px;flex:1}.item.active .dot{background:#1456ba;border-color:#1456ba;width:15px;height:15px;margin-top:17px}.item.past .dot{background:#8395ae}.event{border:1px solid #d8e0eb;border-radius:14px;background:white;padding:15px 13px;text-align:left;color:inherit;width:100%;margin-bottom:9px;cursor:pointer}.item.active .event{background:#eaf2ff;border-color:#1456ba}.row{display:flex;gap:10px;align-items:flex-start}.emoji{font-size:21px}.info{flex:1;min-width:0}.name{font-size:15px;font-weight:700;line-height:1.5}.tag{display:inline-block;margin-top:8px;color:#43546a;border:1px solid #d8e0eb;border-radius:6px;padding:2px 7px;font-size:11px}.now{color:#1456ba;font-size:11px;font-weight:700;margin-left:7px}.chev{color:#84918a}.description{border-top:1px solid #d8e0eb;margin-top:12px;padding-top:12px;font-size:13px;line-height:1.8;color:#344761}.footer{font-size:11px;color:#78847d;line-height:1.8;margin-top:25px}.error{color:#a83d3d;padding:18px;border:1px solid #ecc5c5;border-radius:12px}button:focus-visible{outline:3px solid #e6a400;outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}.event{min-height:52px}.today,.day{min-height:44px}.footer{color:#4e6078}.item:last-child .stem{background:transparent}html{touch-action:manipulation}button{touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}.event{font-size:16px}.row{align-items:center}.event:active{background:#eaf2ff}.event[aria-expanded=true]{border-color:#8eafd9}.day[aria-pressed=true] .day-date{color:#fff}</style></head><body><main><header><div><div class="eyebrow">FAMILY TRIP · IWATE / MIYAGI</div><h1>東北、3日間。</h1><p class="sub">10月11日 — 13日 · 一関 / 盛岡 / 仙台 / 松島</p></div><div><div class="eyebrow">日本時間</div><div id="clock" class="clock">--:--</div></div></header><nav id="days" class="days" aria-label="旅行日を選択"></nav><div class="section-head"><div><h2 id="heading">旅程</h2><p id="subtitle" class="sub"></p></div><button class="today" id="today">現在に戻る</button></div><div id="timeline" class="timeline">読み込み中…</div><p class="footer">時刻・予定は旅行計画に基づくものです。仮の新幹線時刻などは予約内容を必ず確認してください。現在位置は取得せず、日本時間を基準に表示しています。</p></main>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id);
let data=[],selected=0,expanded=null,previous='';
function jst(){const parts=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date());const get=k=>parts.find(p=>p.type===k)?.value;return{date:get('year')+'-'+get('month')+'-'+get('day'),time:get('hour')+':'+get('minute')}}
function node(tag,cls,content){const n=document.createElement(tag);if(cls)n.className=cls;if(content!=null)n.textContent=content;return n}
function render(force=false){const now=jst();$('clock').textContent=now.time;const day=data[selected];if(!day)return;const active=day.date===now.date?day.events.reduce((a,e,i)=>e[0]<=now.time?i:a,-1):-1;const key=selected+'/'+active+'/'+now.date;if(!force&&previous===key)return;previous=key;
$('days').replaceChildren();data.forEach((d,i)=>{const b=node('button','day');b.type='button';b.setAttribute('aria-pressed',String(selected===i));const weekday=['日','月','火'][i]||'';const small=node('small','',weekday+'曜日');const big=node('b','',String(Number(d.date.slice(-2))));const label=node('small','',d.title);b.append(small,big,label);b.addEventListener('click',()=>{selected=i;expanded=null;render(true)});$('days').append(b)});
$('heading').textContent='DAY '+(selected+1)+' · '+day.title;$('subtitle').textContent=day.subtitle;$('timeline').replaceChildren();
day.events.forEach((e,i)=>{const [time,title,category,description]=e;const current=i===active;const past=day.date<now.date||(day.date===now.date&&i<active);const outer=node('div','item'+(current?' active':'')+(past?' past':''));const t=node('div','time',time);const track=node('div','track');track.append(node('span','dot'),node('span','stem'));const b=node('button','event');b.type='button';const open=expanded===selected+'-'+i;b.setAttribute('aria-expanded',String(open));const row=node('div','row');const info=node('div','info');info.append(node('div','name',title));const tag=node('span','tag',category);info.append(tag);if(current)info.append(node('span','now','● 現在の時間帯'));row.append(info,node('span','chev',open?'⌃':'⌄'));b.append(row);if(open)b.append(node('div','description',description));b.addEventListener('click',()=>{expanded=open?null:selected+'-'+i;render(true)});outer.append(t,track,b);$('timeline').append(outer)});
}
$('today').addEventListener('click',()=>{const i=data.findIndex(d=>d.date===jst().date);selected=i<0?0:i;expanded=null;render(true)});
fetch('./data/itinerary.json').then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(json=>{if(!Array.isArray(json.days))throw Error('Invalid data');data=json.days;const i=data.findIndex(d=>d.date===jst().date);selected=i<0?0:i;render(true);setInterval(render,30000)}).catch(err=>{$('timeline').replaceChildren(node('div','error','旅程データを読み込めませんでした。ページを再読み込みしてください。 '+err.message))});
})();
</script></body></html>
