<script>
(()=>{'use strict';
const $=id=>document.getElementById(id);
let data=[],selected=0,expanded=null,previous='';
function jst(){const parts=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date());const get=k=>parts.find(p=>p.type===k)?.value;return{date:get('year')+'-'+get('month')+'-'+get('day'),time:get('hour')+':'+get('minute')}}
function node(tag,cls,content){const n=document.createElement(tag);if(cls)n.className=cls;if(content!=null)n.textContent=content;return n}
function render(force=false){const now=jst();$('clock').textContent=now.time;const day=data[selected];if(!day)return;const active=day.date===now.date?day.events.reduce((a,e,i)=>e[0]<=now.time?i:a,-1):-1;const key=selected+'/'+active+'/'+now.date;if(!force&&previous===key)return;previous=key;
$('days').replaceChildren();data.forEach((d,i)=>{const b=node('button','day');b.type='button';b.setAttribute('aria-pressed',String(selected===i));const weekday=['日','月','火'][i]||'';const small=node('small','',weekday+'曜日');const big=node('b','',String(Number(d.date.slice(-2))));const label=node('small','',d.title);b.append(small,big,label);b.addEventListener('click',()=>{selected=i;expanded=null;render(true)});$('days').append(b)});
$('heading').textContent='DAY '+(selected+1)+' · '+day.title;$('subtitle').textContent=day.subtitle;$('timeline').replaceChildren();
day.events.forEach((e,i)=>{const [time,title,category,description]=e;const current=i===active;const past=day.date<now.date||(day.date===now.date&&i<active);const outer=node('div','item'+(current?' active':'')+(past?' past':''));const t=node('div','time',time);const track=node('div','track');track.append(node('span','dot'),node('span','stem'));const b=node('button','event');b.type='button';const open=expanded===selected+'-'+i;b.setAttribute('aria-expanded',String(open));const row=node('div','row');const info=node('div','info');info.append(node('div','name',title));const tag=node('span','tag',category);info.append(tag);if(current)info.append(node('span','now','● 現在の時間帯'));row.append(info,node('span','chev',open?'⌃':'⌄'));b.append(row);if(open)b.append(node('div','description',description));b.addEventListener('click',()=>{expanded=open?null:selected+'-'+i;render(true)});outer.append(t,track,b);$('timeline').append(outer)});
}
$('today').addEventListener('click',()=>{const i=data.findIndex(d=>d.date===jst().date);selected=i<0?0:i;expanded=null;render(true)});
fetch('./data/itinerary.json').then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(json=>{if(!Array.isArray(json.days))throw Error('Invalid data');data=json.days;const i=data.findIndex(d=>d.date===jst().date);selected=i<0?0:i;render(true);setInterval(render,30000)}).catch(err=>{$('timeline').replaceChildren(node('div','error','旅程データを読み込めませんでした。ページを再読み込みしてください。 '+err.message))});
})();
</script></body></html>
